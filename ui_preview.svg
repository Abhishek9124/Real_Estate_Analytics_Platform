<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
    <style>
      .browser-bar { fill: #e2e8f0; }
      .dot { r: 6; }
      .url { fill: #475569; font-size: 12px; font-family: monospace; }
      .sidebar { fill: #f8fafc; }
      .nav-item { fill: #475569; font-size: 14px; font-weight: 500; }
      .nav-active { fill: #2563eb; font-weight: 700; }
      .title { fill: #0f172a; font-size: 32px; font-weight: 800; }
      .caption { fill: #64748b; font-size: 14px; }
      .card-title { fill: #0f172a; font-size: 18px; font-weight: 700; }
      .card-body { fill: #475569; font-size: 13px; }
      .card-caption { fill: #94a3b8; font-size: 11px; font-style: italic; }
      .metric-label { fill: #64748b; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
      .metric-value { fill: #0f172a; font-size: 24px; font-weight: 800; }
      .section { fill: #0f172a; font-size: 18px; font-weight: 700; }
      .divider { stroke: #e2e8f0; stroke-width: 1; }
      .tech { fill: #475569; font-size: 13px; }
    </style>
  </defs>

  <!-- Browser frame -->
  <rect width="1280" height="800" fill="#cbd5e1"/>
  <rect x="0" y="0" width="1280" height="44" class="browser-bar"/>
  <circle cx="22" cy="22" class="dot" fill="#ef4444"/>
  <circle cx="46" cy="22" class="dot" fill="#f59e0b"/>
  <circle cx="70" cy="22" class="dot" fill="#22c55e"/>
  <rect x="110" y="12" width="700" height="22" rx="11" fill="#ffffff"/>
  <text x="124" y="28" class="url">🔒 localhost:8501  —  Gurgaon Real Estate Analytics</text>

  <!-- App background -->
  <rect x="0" y="44" width="1280" height="756" fill="#ffffff"/>

  <!-- Sidebar -->
  <rect x="0" y="44" width="240" height="756" class="sidebar"/>
  <text x="24" y="80" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">NAVIGATION</text>

  <rect x="12" y="92" width="216" height="38" rx="8" fill="#dbeafe"/>
  <text x="28" y="116" class="nav-active">🏠  Home</text>

  <rect x="12" y="140" width="216" height="38" rx="8" fill="transparent"/>
  <text x="28" y="164" class="nav-item">💰  Price Predictor</text>

  <rect x="12" y="188" width="216" height="38" rx="8" fill="transparent"/>
  <text x="28" y="212" class="nav-item">📊  Analysis App</text>

  <rect x="12" y="236" width="216" height="38" rx="8" fill="transparent"/>
  <text x="28" y="260" class="nav-item">🤖  Recommend Apartments</text>

  <rect x="12" y="730" width="216" height="50" rx="8" fill="#dcfce7"/>
  <text x="28" y="755" font-size="12" font-weight="600" fill="#15803d">👈 Select a page above</text>

  <!-- Main content -->
  <!-- Hero -->
  <rect x="280" y="76" width="960" height="100" rx="14" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="310" y="120" fill="#fff" font-size="28" font-weight="800">🏠 Gurgaon Real Estate Analytics Platform</text>
  <text x="310" y="150" fill="#e0e7ff" font-size="14">End-to-end analytics, price prediction, and recommendations for the Gurgaon property market.</text>

  <!-- Divider -->
  <line x1="280" y1="200" x2="1240" y2="200" class="divider"/>

  <!-- Feature Cards -->
  <g filter="url(#shadow)">
    <rect x="280" y="220" width="305" height="160" rx="12" fill="url(#card)"/>
  </g>
  <text x="300" y="252" class="card-title">💰  Price Predictor</text>
  <text x="300" y="282" class="card-body">Estimate a property's price from</text>
  <text x="300" y="300" class="card-body">its attributes — sector, size, BHK,</text>
  <text x="300" y="318" class="card-body">luxury tier, and more.</text>
  <text x="300" y="352" class="card-caption">Powered by a tuned regression pipeline</text>
  <text x="300" y="367" class="card-caption">trained on 3,000+ listings.</text>

  <g filter="url(#shadow)">
    <rect x="607" y="220" width="305" height="160" rx="12" fill="url(#card)"/>
  </g>
  <text x="627" y="252" class="card-title">📊  Analysis App</text>
  <text x="627" y="282" class="card-body">Explore sector-level prices,</text>
  <text x="627" y="300" class="card-body">geomaps, wordclouds, BHK</text>
  <text x="627" y="318" class="card-body">distributions, and correlations.</text>
  <text x="627" y="352" class="card-caption">Interactive Plotly charts and</text>
  <text x="627" y="367" class="card-caption">Streamlit widgets.</text>

  <g filter="url(#shadow)">
    <rect x="934" y="220" width="305" height="160" rx="12" fill="url(#card)"/>
  </g>
  <text x="954" y="252" class="card-title">🤖  Recommend Apartments</text>
  <text x="954" y="282" class="card-body">Find societies similar to a chosen</text>
  <text x="954" y="300" class="card-body">property, or search by proximity</text>
  <text x="954" y="318" class="card-body">to a landmark.</text>
  <text x="954" y="352" class="card-caption">Content-based filtering with</text>
  <text x="954" y="367" class="card-caption">TF-IDF + cosine similarity.</text>

  <line x1="280" y1="410" x2="1240" y2="410" class="divider"/>

  <!-- Stats -->
  <text x="280" y="445" class="section">📈 Platform Snapshot</text>

  <g filter="url(#shadow)">
    <rect x="280" y="465" width="225" height="90" rx="10" fill="#ffffff"/>
  </g>
  <text x="300" y="492" class="metric-label">LISTINGS ANALYZED</text>
  <text x="300" y="530" class="metric-value">3,000+</text>

  <g filter="url(#shadow)">
    <rect x="525" y="465" width="225" height="90" rx="10" fill="#ffffff"/>
  </g>
  <text x="545" y="492" class="metric-label">GURGAON SECTORS</text>
  <text x="545" y="530" class="metric-value">100+</text>

  <g filter="url(#shadow)">
    <rect x="770" y="465" width="225" height="90" rx="10" fill="#ffffff"/>
  </g>
  <text x="790" y="492" class="metric-label">PROPERTY TYPES</text>
  <text x="790" y="530" class="metric-value">Flats + Houses</text>

  <g filter="url(#shadow)">
    <rect x="1015" y="465" width="225" height="90" rx="10" fill="#ffffff"/>
  </g>
  <text x="1035" y="492" class="metric-label">MODEL</text>
  <text x="1035" y="530" class="metric-value">Regression</text>

  <line x1="280" y1="595" x2="1240" y2="595" class="divider"/>

  <!-- Tech stack -->
  <text x="280" y="630" class="section">🛠️ Tech Stack</text>
  <g font-size="12" font-weight="600">
    <rect x="280" y="650" width="80" height="28" rx="14" fill="#dbeafe"/>
    <text x="293" y="669" fill="#1e40af">Python</text>

    <rect x="370" y="650" width="80" height="28" rx="14" fill="#dcfce7"/>
    <text x="384" y="669" fill="#15803d">pandas</text>

    <rect x="460" y="650" width="105" height="28" rx="14" fill="#fef3c7"/>
    <text x="474" y="669" fill="#92400e">scikit-learn</text>

    <rect x="575" y="650" width="85" height="28" rx="14" fill="#fce7f3"/>
    <text x="589" y="669" fill="#9f1239">XGBoost</text>

    <rect x="670" y="650" width="90" height="28" rx="14" fill="#e0e7ff"/>
    <text x="684" y="669" fill="#4338ca">Streamlit</text>

    <rect x="770" y="650" width="70" height="28" rx="14" fill="#cffafe"/>
    <text x="784" y="669" fill="#0e7490">Plotly</text>

    <rect x="850" y="650" width="85" height="28" rx="14" fill="#ffe4e6"/>
    <text x="864" y="669" fill="#9f1239">Seaborn</text>

    <rect x="945" y="650" width="110" height="28" rx="14" fill="#f3e8ff"/>
    <text x="959" y="669" fill="#6b21a8">WordCloud</text>
  </g>

  <text x="280" y="720" class="section">🚀 Get Started</text>
  <text x="280" y="745" class="card-body">Click any page in the sidebar to begin exploring.</text>
</svg>
